name: Secret scan

# Fails any push or pull request that adds a secret: a password, key or token in code, including as the default of an
# environment lookup (workspace CLAUDE.md §14). Only the new commits are scanned; secrets already in history are dealt
# with by rotating them, not by failing every later push. Rules: .gitleaks.toml.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    # The org's own runner on the server, like every other workflow here (GitHub-hosted runners are not used).
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        env:
          VERSION: 8.21.2
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks

      - name: Scan the new commits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${AFTER}"
          else
            RANGE="-1 ${AFTER}"
          fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner --exit-code 1 .